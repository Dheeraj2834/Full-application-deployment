name: Frontend SonarQube + Docker CI/CD

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "Application/frontend/**"
      - ".github/workflows/frontend-ci-cd.yml"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: frontend
  IMAGE_TAG: latest
  CONTAINER_NAME: frontend
  CONTAINER_PORT: 8501

jobs:

  # ==========================================================
  # JOB 1: SONARQUBE CODE QUALITY
  # ==========================================================
  sonarqube:

    name: SonarQube Code Quality

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # --------------------------------------------------------
      # 2. Setup Java
      # --------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # --------------------------------------------------------
      # 3. SonarQube Scan
      # --------------------------------------------------------
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: Application/frontend
          args: >
            -Dsonar.projectKey=frontend
            -Dsonar.projectName=Frontend
            -Dsonar.sources=.
            -Dsonar.sourceEncoding=UTF-8


      # --------------------------------------------------------
      # 4. Verify SonarQube Report
      # --------------------------------------------------------
      - name: Check SonarQube Scan Result
        run: |

          echo "Checking SonarQube scanner report..."

          if [ -f "Application/frontend/.scannerwork/report-task.txt" ]; then

            echo "SonarQube report found."

            cat Application/frontend/.scannerwork/report-task.txt

          else

            echo "ERROR: SonarQube report not found."

            ls -la Application/frontend

            exit 1

          fi


      # --------------------------------------------------------
      # 5. SonarQube Quality Gate
      # --------------------------------------------------------
      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scanMetadataReportFile: Application/frontend/.scannerwork/report-task.txt


  # ==========================================================
  # JOB 2: DOCKER BUILD + ECR + DEPLOY
  # ==========================================================
  docker:

    name: Docker Build and Deploy

    runs-on: ubuntu-latest

    # IMPORTANT:
    # Docker job runs ONLY if SonarQube job succeeds
    needs: sonarqube

    steps:

      # --------------------------------------------------------
      # 1. Checkout source code
      # --------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # 2. Configure AWS using GitHub OIDC
      # --------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # --------------------------------------------------------
      # 3. Verify AWS Identity
      # --------------------------------------------------------
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # --------------------------------------------------------
      # 4. Create ECR Repository if not exists
      # --------------------------------------------------------
      - name: Create ECR repository
        run: |

          aws ecr describe-repositories \
            --repository-names "${{ env.ECR_REPOSITORY }}" \
            --region "${{ env.AWS_REGION }}" \
          || aws ecr create-repository \
            --repository-name "${{ env.ECR_REPOSITORY }}" \
            --region "${{ env.AWS_REGION }}"


      # --------------------------------------------------------
      # 5. Login to Amazon ECR
      # --------------------------------------------------------
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2


      # --------------------------------------------------------
      # 6. Build Docker Image
      # --------------------------------------------------------
      - name: Build frontend Docker image
        working-directory: Application/frontend
        run: |

          docker build \
            -t ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
            .


      # --------------------------------------------------------
      # 7. Verify Docker Image
      # --------------------------------------------------------
      - name: Verify Docker image
        run: |

          docker images


      # --------------------------------------------------------
      # 8. Push Docker Image to ECR
      # --------------------------------------------------------
      - name: Push frontend image to ECR
        run: |

          docker push \
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}


      # --------------------------------------------------------
      # 9. Deploy to Private EC2 using SSM
      # --------------------------------------------------------
      - name: Deploy frontend to EC2
        run: |

          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy frontend Docker container" \
            --parameters 'commands=[
              "echo Logging into Amazon ECR...",
              "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ steps.ecr.outputs.registry }}",

              "echo Pulling latest frontend image...",
              "docker pull ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}",

              "echo Stopping existing frontend container...",
              "docker stop ${{ env.CONTAINER_NAME }} || true",

              "echo Removing existing frontend container...",
              "docker rm ${{ env.CONTAINER_NAME }} || true",

              "echo Starting new frontend container...",
              "docker run -d --name ${{ env.CONTAINER_NAME }} -p 8501:8501 ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}",

              "echo Checking running containers...",
              "docker ps"
            ]' \
            --region "${{ env.AWS_REGION }}"