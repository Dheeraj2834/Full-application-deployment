name: Bastion Host Infrastructure

on:
  workflow_dispatch:
    
  # workflow_run:
  #   workflows:
  #     - "VPC Infrastructure"
  #   types:
  #     - completed

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.14.7"
  TF_WORKING_DIR: Terraform/Root/env/dev

jobs:

  # ============================================================
  # CHECK VPC PIPELINE
  # ============================================================

  check-vpc:
    name: Check VPC Pipeline
    runs-on: ubuntu-latest

    # Run automatically ONLY when VPC pipeline succeeds.
    #
    # workflow_dispatch allows manual execution.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success'
      )

    steps:

      - name: VPC Pipeline Successful
        run: |
          echo "=========================================="
          echo "VPC Pipeline completed successfully"
          echo "=========================================="
          echo "Starting Bastion Host deployment..."

  # ============================================================
  # TERRAFORM PLAN
  # ============================================================

  terraform-plan:
    name: Bastion - Terraform Plan
    runs-on: ubuntu-latest

    needs:
      - check-vpc

    steps:

      # ----------------------------------------------------------
      # Checkout Repository
      # ----------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Configure AWS using GitHub OIDC
      # ----------------------------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      # ----------------------------------------------------------
      # Setup Terraform
      # ----------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ----------------------------------------------------------
      # Terraform Init
      # ----------------------------------------------------------

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init

      # ----------------------------------------------------------
      # Terraform Validate
      # ----------------------------------------------------------

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform validate

      # ----------------------------------------------------------
      # Terraform Plan - Bastion
      # ----------------------------------------------------------

      - name: Terraform Plan - Bastion Host
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -target=module.bastionhost \
            -out=bastion.tfplan

      # ----------------------------------------------------------
      # Upload Terraform Plan
      # ----------------------------------------------------------

      - name: Upload Bastion Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: bastion-terraform-plan
          path: ${{ env.TF_WORKING_DIR }}/bastion.tfplan
          retention-days: 1


  # ============================================================
  # APPROVAL + APPLY
  # ============================================================

  terraform-apply:
    name: Bastion - Terraform Apply
    runs-on: ubuntu-latest

    needs:
      - terraform-plan

    # ------------------------------------------------------------
    # GitHub Environment Approval
    # ------------------------------------------------------------

    environment:
      name: dev

    steps:

      # ----------------------------------------------------------
      # Checkout Repository
      # ----------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Configure AWS using GitHub OIDC
      # ----------------------------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      # ----------------------------------------------------------
      # Setup Terraform
      # ----------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ----------------------------------------------------------
      # Terraform Init
      # ----------------------------------------------------------

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init

      # ----------------------------------------------------------
      # Download Bastion Plan
      # ----------------------------------------------------------

      - name: Download Bastion Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: bastion-terraform-plan
          path: ${{ env.TF_WORKING_DIR }}

      # ----------------------------------------------------------
      # Terraform Apply
      # ----------------------------------------------------------

      - name: Terraform Apply - Bastion Host
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply \
            -auto-approve \
            bastion.tfplan