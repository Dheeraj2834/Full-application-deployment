name: Frontend SonarQube

on:
  workflow_dispatch:

  # Enable this when you want automatic scans
  # push:
  #   branches:
  #     - main

jobs:

  sonarqube:

    name: SonarQube Code Quality
    runs-on: self-hosted

    steps:

      ######################################################
      # Checkout
      ######################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      ######################################################
      # Install Docker
      ######################################################

      - name: Install Docker
        shell: bash
        run: |
          set -e

          echo "Checking Docker..."

          if ! command -v docker >/dev/null 2>&1; then

            echo "Docker not found. Installing..."

            sudo dnf install -y docker

            sudo systemctl enable docker
            sudo systemctl start docker

          else

            echo "Docker already installed."

          fi

          sudo systemctl enable docker
          sudo systemctl start docker

          echo "Docker version:"
          sudo docker --version

      ######################################################
      # Start SonarQube
      ######################################################

      - name: Start SonarQube
        shell: bash
        run: |
          set -e

          echo "Checking SonarQube container..."

          if sudo docker ps -a --format '{{.Names}}' | grep -q '^sonarqube$'; then

            echo "SonarQube container already exists."

            sudo docker start sonarqube || true

          else

            echo "Pulling SonarQube image..."

            sudo docker pull sonarqube:community

            echo "Starting SonarQube..."

            sudo docker run -d \
              --name sonarqube \
              --restart unless-stopped \
              -p 9000:9000 \
              sonarqube:community

          fi

      ######################################################
      # Wait for SonarQube
      ######################################################

      - name: Wait for SonarQube
        shell: bash
        run: |
          set -e

          echo "Waiting for SonarQube to start..."

          for i in {1..30}; do

            STATUS=$(curl -s http://localhost:9000/api/system/status | \
              sed -n 's/.*"status":"\([^"]*\)".*/\1/p')

            echo "SonarQube status: $STATUS"

            if [ "$STATUS" = "UP" ]; then
              echo "SonarQube is ready."
              exit 0
            fi

            sleep 10

          done

          echo "SonarQube failed to start."

          sudo docker logs --tail 100 sonarqube

          exit 1

      ######################################################
      # Create SonarQube Token
      ######################################################

      - name: Create SonarQube Token
        shell: bash
        env:
          SONAR_ADMIN_PASSWORD: ${{ secrets.SONAR_ADMIN_PASSWORD }}
        run: |

          set -e

          echo "Checking SonarQube authentication..."

          RESPONSE=$(curl -s \
            -u "admin:${SONAR_ADMIN_PASSWORD}" \
            "http://localhost:9000/api/authentication/validate")

          echo "$RESPONSE"

          if echo "$RESPONSE" | grep -q '"valid":true'; then
            echo "SonarQube admin authentication successful."
          else
            echo "SonarQube admin authentication failed."
            exit 1
          fi

          ##################################################
          # Generate token
          ##################################################

          TOKEN_RESPONSE=$(curl -s \
            -u "admin:${SONAR_ADMIN_PASSWORD}" \
            -X POST \
            "http://localhost:9000/api/user_tokens/generate" \
            -d "name=github-actions-${GITHUB_RUN_ID}")

          TOKEN=$(echo "$TOKEN_RESPONSE" | \
            sed -n 's/.*"token":"\([^"]*\)".*/\1/p')

          if [ -z "$TOKEN" ]; then
            echo "Failed to generate SonarQube token."
            echo "$TOKEN_RESPONSE"
            exit 1
          fi

          echo "SONAR_TOKEN=$TOKEN" >> "$GITHUB_ENV"

          echo "SonarQube token generated successfully."

      ######################################################
      # Install Java
      ######################################################

      - name: Install Java 17
        shell: bash
        run: |

          set -e

          if ! command -v java >/dev/null 2>&1; then

            echo "Installing Java 17..."

            sudo dnf install -y java-17-amazon-corretto

          fi

          echo "Java version:"
          java -version

      ######################################################
      # Install Sonar Scanner
      ######################################################

      - name: Install Sonar Scanner
        shell: bash
        run: |

          set -e

          if ! command -v sonar-scanner >/dev/null 2>&1; then

            echo "Installing Sonar Scanner..."

            cd /tmp

            curl -L \
              -o sonar-scanner.zip \
              https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-7.1.0.6341-linux-x64.zip

            sudo dnf install -y unzip

            unzip -q sonar-scanner.zip

            sudo rm -rf /opt/sonar-scanner

            sudo mv sonar-scanner-* /opt/sonar-scanner

            sudo ln -sf \
              /opt/sonar-scanner/bin/sonar-scanner \
              /usr/local/bin/sonar-scanner

          fi

          echo "Sonar Scanner version:"

          sonar-scanner --version

      ######################################################
      # Create SonarQube Project
      ######################################################

      - name: Create SonarQube Project
        shell: bash
        run: |

          set -e

          curl -s \
            -u "${SONAR_TOKEN}:" \
            -X POST \
            "http://localhost:9000/api/projects/create" \
            -d "project=frontend" \
            -d "name=frontend" \
            || true

          echo "SonarQube project ready."

      ######################################################
      # Run SonarQube Analysis
      ######################################################

      - name: Run SonarQube Analysis
        shell: bash
        run: |

          set -e

          echo "======================================"
          echo "🔍 SONARQUBE CODE ANALYSIS"
          echo "======================================"

          sonar-scanner \
            -Dsonar.projectKey=frontend \
            -Dsonar.projectName=frontend \
            -Dsonar.sources=Application/frontend \
            -Dsonar.host.url=http://localhost:9000 \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.sourceEncoding=UTF-8

      ######################################################
      # Wait for Quality Gate
      ######################################################

      - name: Wait for Quality Gate
        shell: bash
        run: |

          set -e

          echo "Waiting for SonarQube Quality Gate..."

          sleep 10

          for i in {1..30}; do

            RESPONSE=$(curl -s \
              -u "${SONAR_TOKEN}:" \
              "http://localhost:9000/api/qualitygates/project_status?projectKey=frontend")

            STATUS=$(echo "$RESPONSE" | \
              sed -n 's/.*"projectStatus":{"status":"\([^"]*\)".*/\1/p')

            echo "Quality Gate status: $STATUS"

            if [ "$STATUS" = "OK" ]; then

              echo "======================================"
              echo "✅ QUALITY GATE PASSED"
              echo "======================================"

              exit 0

            elif [ "$STATUS" = "ERROR" ]; then

              echo "======================================"
              echo "❌ QUALITY GATE FAILED"
              echo "======================================"

              echo "$RESPONSE"

              exit 1

            fi

            sleep 10

          done

          echo "Quality Gate check timed out."

          exit 1