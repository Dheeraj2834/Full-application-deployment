name: Frontend SonarQube Check

on:
  workflow_dispatch:

  # Uncomment when you want automatic execution
  # push:
  #   branches:
  #     - main

permissions:
  id-token: write
  contents: read

jobs:

  sonarqube:

    name: Install SonarQube and Check Frontend

    runs-on: ubuntu-latest

    steps:

      ######################################################
      # AWS OIDC
      ######################################################

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      ######################################################
      # Checkout
      ######################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      ######################################################
      # Send deployment/check command to Private EC2
      ######################################################

      - name: Run SonarQube on Private EC2
        id: sonar
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.FRONTEND_INSTANCE_ID }}
          SONAR_ADMIN_PASSWORD: ${{ secrets.SONAR_ADMIN_PASSWORD }}
        run: |

          set -e

          echo "=============================================="
          echo "Connecting to Private EC2 using AWS SSM"
          echo "=============================================="

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Frontend SonarQube Analysis" \
            --parameters commands="[
              \"set -e\",
              \"echo '========================================'\",
              \"echo '1. Installing required packages'\",
              \"echo '========================================'\",
              \"sudo dnf install -y git python3 python3-pip java-17-amazon-corretto curl unzip wget\",

              \"echo '========================================'\",
              \"echo '2. Installing PostgreSQL'\",
              \"echo '========================================'\",
              \"sudo dnf install -y postgresql15-server postgresql15\",

              \"if [ ! -d /var/lib/pgsql/data ]; then sudo postgresql-setup --initdb; fi\",
              \"sudo systemctl enable postgresql\",
              \"sudo systemctl start postgresql\",

              \"sudo -u postgres psql -tc \\\\\"SELECT 1 FROM pg_roles WHERE rolname='sonarqube'\\\\\" | grep -q 1 || sudo -u postgres psql -c \\\\\"CREATE USER sonarqube WITH PASSWORD 'sonarqube';\\\\\"\",
              \"sudo -u postgres psql -tc \\\\\"SELECT 1 FROM pg_database WHERE datname='sonarqube'\\\\\" | grep -q 1 || sudo -u postgres psql -c \\\\\"CREATE DATABASE sonarqube OWNER sonarqube;\\\\\"\",

              \"echo '========================================'\",
              \"echo '3. Installing SonarQube'\",
              \"echo '========================================'\",

              \"if [ ! -d /opt/sonarqube ]; then\",
              \"  cd /tmp\",
              \"  wget -q https://binaries.sonarsource.com/Distribution/sonarqube/sonarqube-25.12.0.117093.zip -O sonarqube.zip\",
              \"  unzip -q sonarqube.zip\",
              \"  sudo mv sonarqube-* /opt/sonarqube\",
              \"  sudo useradd --system --no-create-home --shell /sbin/nologin sonar || true\",
              \"  sudo chown -R sonar:sonar /opt/sonarqube\",
              \"fi\",

              \"echo 'sonar.jdbc.username=sonarqube' | sudo tee /opt/sonarqube/conf/sonar.properties >/dev/null\",
              \"echo 'sonar.jdbc.password=sonarqube' | sudo tee -a /opt/sonarqube/conf/sonar.properties >/dev/null\",
              \"echo 'sonar.jdbc.url=jdbc:postgresql://localhost:5432/sonarqube' | sudo tee -a /opt/sonarqube/conf/sonar.properties >/dev/null\",
              \"echo 'sonar.web.host=127.0.0.1' | sudo tee -a /opt/sonarqube/conf/sonar.properties >/dev/null\",
              \"echo 'sonar.web.port=9000' | sudo tee -a /opt/sonarqube/conf/sonar.properties >/dev/null\",

              \"sudo tee /etc/systemd/system/sonarqube.service >/dev/null <<'EOF'\",
              \"[Unit]\",
              \"Description=SonarQube service\",
              \"After=network.target postgresql.service\",
              \"[Service]\",
              \"Type=forking\",
              \"User=sonar\",
              \"Group=sonar\",
              \"ExecStart=/opt/sonarqube/bin/linux-x86-64/sonar.sh start\",
              \"ExecStop=/opt/sonarqube/bin/linux-x86-64/sonar.sh stop\",
              \"Restart=always\",
              \"LimitNOFILE=65536\",
              \"LimitNPROC=4096\",
              \"[Install]\",
              \"WantedBy=multi-user.target\",
              \"EOF\",

              \"sudo systemctl daemon-reload\",
              \"sudo systemctl enable sonarqube\",
              \"sudo systemctl restart sonarqube\",

              \"echo '========================================'\",
              \"echo '4. Waiting for SonarQube'\",
              \"echo '========================================'\",

              \"for i in $(seq 1 60); do\",
              \"  STATUS=$(curl -s http://127.0.0.1:9000/api/system/status | sed -n 's/.*\\\\\\\"status\\\\\\\":\\\\\\\"\\\\([^\\\\\\\"]*\\\\\\\").*/\\\\1/p') || true\",
              \"  echo SonarQube status: $STATUS\",
              \"  if [ \\\"$STATUS\\\" = \\\"UP\\\" ]; then break; fi\",
              \"  sleep 10\",
              \"done\",

              \"if ! curl -sf http://127.0.0.1:9000/api/system/status | grep -q '\\\\\\\"status\\\\\\\":\\\\\\\"UP\\\\\\\"'; then\",
              \"  echo 'SonarQube did not start successfully'\",
              \"  sudo journalctl -u sonarqube --no-pager -n 100\",
              \"  exit 1\",
              \"fi\",

              \"echo '========================================'\",
              \"echo '5. Installing SonarScanner'\",
              \"echo '========================================'\",

              \"if [ ! -x /opt/sonar-scanner/bin/sonar-scanner ]; then\",
              \"  cd /tmp\",
              \"  wget -q https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-7.1.0.6341-linux-x64.zip -O sonar-scanner.zip\",
              \"  unzip -q sonar-scanner.zip\",
              \"  sudo rm -rf /opt/sonar-scanner\",
              \"  sudo mv sonar-scanner-* /opt/sonar-scanner\",
              \"fi\",

              \"sudo ln -sf /opt/sonar-scanner/bin/sonar-scanner /usr/local/bin/sonar-scanner\",

              \"echo '========================================'\",
              \"echo '6. Clone Repository'\",
              \"echo '========================================'\",

              \"sudo mkdir -p /home/ec2-user/front\",
              \"sudo chown -R ec2-user:ec2-user /home/ec2-user/front\",
              \"cd /home/ec2-user/front\",

              \"if [ -d Full-application-deployment/.git ]; then\",
              \"  cd Full-application-deployment\",
              \"  git fetch origin\",
              \"  git reset --hard origin/main\",
              \"else\",
              \"  git clone https://github.com/Dheeraj2834/Full-application-deployment.git\",
              \"  cd Full-application-deployment\",
              \"fi\",

              \"echo '========================================'\",
              \"echo '7. Frontend Directory'\",
              \"echo '========================================'\",

              \"cd Application/frontend\",
              \"pwd\",
              \"ls -la\",

              \"echo '========================================'\",
              \"echo '8. Creating SonarQube Configuration'\",
              \"echo '========================================'\",

              \"sudo tee sonar-project.properties >/dev/null <<'EOF'\",
              \"sonar.projectKey=frontend\",
              \"sonar.projectName=frontend\",
              \"sonar.sources=.\",
              \"sonar.sourceEncoding=UTF-8\",
              \"EOF\",

              \"echo '========================================'\",
              \"echo '9. Running SonarQube Analysis'\",
              \"echo '========================================'\",

              \"if [ -z \\\"${SONAR_ADMIN_PASSWORD}\\\" ]; then echo 'SONAR_ADMIN_PASSWORD is missing'; exit 1; fi\",

              \"echo 'Using SonarQube admin credentials to generate scanner token...'\",

              \"TOKEN_RESPONSE=$(curl -s -u admin:${SONAR_ADMIN_PASSWORD} -X POST 'http://127.0.0.1:9000/api/user_tokens/generate' -d 'name=github-actions-'$(date +%s))\",

              \"SONAR_TOKEN=$(echo \\\"$TOKEN_RESPONSE\\\" | sed -n 's/.*\\\\\\\"token\\\\\\\":\\\\\\\"\\\\([^\\\\\\\"]*\\\\\\\").*/\\\\1/p')\",

              \"if [ -z \\\"$SONAR_TOKEN\\\" ]; then echo 'Failed to create SonarQube token'; echo \\\"$TOKEN_RESPONSE\\\"; exit 1; fi\",

              \"sonar-scanner -Dsonar.host.url=http://127.0.0.1:9000 -Dsonar.token=$SONAR_TOKEN\",

              \"echo '========================================'\",
              \"echo '10. Waiting for Quality Gate'\",
              \"echo '========================================'\",

              \"sleep 10\",

              \"for i in $(seq 1 30); do\",
              \"  RESULT=$(curl -s -u $SONAR_TOKEN: 'http://127.0.0.1:9000/api/qualitygates/project_status?projectKey=frontend')\",
              \"  QUALITY=$(echo \\\"$RESULT\\\" | sed -n 's/.*\\\\\\\"projectStatus\\\\\\\":{\\\\\\\"status\\\\\\\":\\\\\\\"\\\\([^\\\\\\\"]*\\\\\\\").*/\\\\1/p')\",
              \"  echo Quality Gate: $QUALITY\",
              \"  if [ \\\"$QUALITY\\\" = \\\"OK\\\" ]; then echo 'QUALITY GATE PASSED'; exit 0; fi\",
              \"  if [ \\\"$QUALITY\\\" = \\\"ERROR\\\" ]; then echo 'QUALITY GATE FAILED'; echo \\\"$RESULT\\\"; exit 1; fi\",
              \"  sleep 10\",
              \"done\",

              \"echo 'Quality Gate timed out'\",
              \"exit 1\"
            ]" \
            --output text \
            --query "Command.CommandId")

          echo "SSM Command ID: $COMMAND_ID"

          echo "Waiting for EC2 command..."

          for i in {1..60}; do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text)

            echo "SSM status: $STATUS"

            case "$STATUS" in

              Success)
                echo "=============================================="
                echo "✅ SONARQUBE QUALITY CHECK PASSED"
                echo "=============================================="

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text

                exit 0
                ;;

              Failed|Cancelled|TimedOut)
                echo "=============================================="
                echo "❌ SONARQUBE CHECK FAILED"
                echo "=============================================="

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardErrorContent" \
                  --output text

                exit 1
                ;;

            esac

            sleep 10

          done

          echo "SSM command timed out."
          exit 1