name: Terraform Dev Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.9.8"
  TF_WORKING_DIR: Terraform/Root/env/dev

jobs:

  # ============================================================
  # TERRAFORM INIT + PLAN
  # ============================================================

  terraform-plan:
    name: Terraform Init and Plan
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # 1. Checkout Repository
      # ----------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # 2. Configure AWS Credentials using GitHub OIDC
      # ----------------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com


      # ----------------------------------------------------------
      # 3. Setup Terraform
      # ----------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}


      # ----------------------------------------------------------
      # 4. Terraform Init
      # ----------------------------------------------------------
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init


      # ----------------------------------------------------------
      # 5. Terraform Validate
      # ----------------------------------------------------------
      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform validate


      # ==========================================================
      # TERRAFORM TARGETED PLANS
      # ==========================================================

      # ----------------------------------------------------------
      # 6. VPC Plan
      # ----------------------------------------------------------
      - name: Terraform Plan - VPC
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -target=module.vpc \
            -out=vpc.tfplan


      # ----------------------------------------------------------
      # 7. Bastion Host Plan
      # ----------------------------------------------------------
      - name: Terraform Plan - Bastion Host
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -target=module.bastionhost \
            -out=bastion.tfplan


      # ----------------------------------------------------------
      # 8. Frontend Plan
      # ----------------------------------------------------------
      - name: Terraform Plan - Frontend
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -target=module.frontend \
            -out=frontend.tfplan


      # ----------------------------------------------------------
      # 9. Backend Plan
      # ----------------------------------------------------------
      - name: Terraform Plan - Backend
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -target=module.backend \
            -out=backend.tfplan


      # ----------------------------------------------------------
      # 10. Database Plan
      # ----------------------------------------------------------
      - name: Terraform Plan - Database
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -target=module.database \
            -out=database.tfplan


      # ==========================================================
      # UPLOAD TERRAFORM PLAN FILES
      # ==========================================================

      - name: Upload Terraform Plans
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plans
          path: |
            ${{ env.TF_WORKING_DIR }}/vpc.tfplan
            ${{ env.TF_WORKING_DIR }}/bastion.tfplan
            ${{ env.TF_WORKING_DIR }}/frontend.tfplan
            ${{ env.TF_WORKING_DIR }}/backend.tfplan
            ${{ env.TF_WORKING_DIR }}/database.tfplan
          retention-days: 1


  # ============================================================
  # APPROVAL + TERRAFORM APPLY
  # ============================================================

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    needs:
      - terraform-plan

    # ------------------------------------------------------------
    # GitHub Environment Approval
    #
    # Repository Settings
    #   → Environments
    #   → dev
    #   → Required reviewers
    #
    # This job waits here until approved.
    # ------------------------------------------------------------

    environment:
      name: dev

    steps:

      # ----------------------------------------------------------
      # 1. Checkout Repository
      # ----------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # 2. Configure AWS Credentials using GitHub OIDC
      # ----------------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com


      # ----------------------------------------------------------
      # 3. Setup Terraform
      # ----------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}


      # ----------------------------------------------------------
      # 4. Terraform Init
      # ----------------------------------------------------------
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init


      # ----------------------------------------------------------
      # 5. Download Terraform Plan Files
      # ----------------------------------------------------------
      - name: Download Terraform Plans
        uses: actions/download-artifact@v4
        with:
          name: terraform-plans
          path: ${{ env.TF_WORKING_DIR }}


      # ==========================================================
      # TERRAFORM APPLY IN ORDER
      # ==========================================================

      # ----------------------------------------------------------
      # 6. Apply VPC
      # ----------------------------------------------------------
      - name: Terraform Apply - VPC
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply \
            -auto-approve \
            vpc.tfplan


      # ----------------------------------------------------------
      # 7. Apply Bastion Host
      # ----------------------------------------------------------
      - name: Terraform Apply - Bastion Host
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply \
            -auto-approve \
            bastion.tfplan


      # ----------------------------------------------------------
      # 8. Apply Frontend
      # ----------------------------------------------------------
      - name: Terraform Apply - Frontend
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply \
            -auto-approve \
            frontend.tfplan


      # ----------------------------------------------------------
      # 9. Apply Backend
      # ----------------------------------------------------------
      - name: Terraform Apply - Backend
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply \
            -auto-approve \
            backend.tfplan


      # ----------------------------------------------------------
      # 10. Apply Database
      # ----------------------------------------------------------
      - name: Terraform Apply - Database
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply \
            -auto-approve \
            database.tfplan