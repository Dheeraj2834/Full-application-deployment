name: Terraform Dev Deployment

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.9.8
  TF_WORKING_DIR: env/dev

jobs:

  terraform-plan:
    name: Terraform Init & Plan
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Configure AWS using OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 3. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # 4. Terraform Init
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      # 5. Terraform Validate
      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      # 6. VPC Plan
      - name: Plan VPC
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -target=module.vpc \
            -out=vpc.tfplan

      # 7. Bastion Host Plan
      - name: Plan Bastion Host
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -target=module.bastionhost \
            -out=bastion.tfplan

      # 8. Frontend Plan
      - name: Plan Frontend
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -target=module.frontend \
            -out=frontend.tfplan

      # 9. Backend Plan
      - name: Plan Backend
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -target=module.backend \
            -out=backend.tfplan

      # 10. Upload all plans
      - name: Upload Terraform Plans
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plans
          path: |
            ${{ env.TF_WORKING_DIR }}/vpc.tfplan
            ${{ env.TF_WORKING_DIR }}/bastion.tfplan
            ${{ env.TF_WORKING_DIR }}/frontend.tfplan
            ${{ env.TF_WORKING_DIR }}/backend.tfplan


  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    needs: terraform-plan

    environment:
      name: dev

    steps:

      # 1. Checkout
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Configure AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 3. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # 4. Terraform Init
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      # 5. Download plans
      - name: Download Terraform Plans
        uses: actions/download-artifact@v4
        with:
          name: terraform-plans
          path: ${{ env.TF_WORKING_DIR }}

      # 6. Apply VPC
      - name: Apply VPC
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply -auto-approve vpc.tfplan

      # 7. Apply Bastion Host
      - name: Apply Bastion Host
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply -auto-approve bastion.tfplan

      # 8. Apply Frontend
      - name: Apply Frontend
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply -auto-approve frontend.tfplan

      # 9. Apply Backend
      - name: Apply Backend
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply -auto-approve backend.tfplan