name: Terraform Dev Deployment

on:
  workflow_dispatch:

#   push:
#     branches:
#       - main
#     paths:
#       - "Terraform/Root/**"
#       - ".github/workflows/terraform-dev.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.14.7"
  TF_WORKING_DIR: Terraform/Root/env/dev


# ============================================================
# JOB 1 - PLAN ALL MODULES
# ============================================================

jobs:

  plan-all:
    name: "1. Plan All Modules"
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # AWS OIDC
      # --------------------------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      # --------------------------------------------------------
      # Terraform
      # --------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init

      # --------------------------------------------------------
      # Validate
      # --------------------------------------------------------

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform validate

      # --------------------------------------------------------
      # VPC PLAN
      # --------------------------------------------------------

      - name: Plan VPC
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "=========================================="
          echo "Planning VPC"
          echo "=========================================="

          terraform plan \
            -target=module.vpc

      # --------------------------------------------------------
      # BASTION PLAN
      # --------------------------------------------------------

      - name: Plan Bastion
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "=========================================="
          echo "Planning Bastion"
          echo "=========================================="

          terraform plan \
            -target=module.bastionhost

      # --------------------------------------------------------
      # FRONTEND PLAN
      # --------------------------------------------------------

      - name: Plan Frontend
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "=========================================="
          echo "Planning Frontend"
          echo "=========================================="

          terraform plan \
            -target=module.frontend

      # --------------------------------------------------------
      # BACKEND PLAN
      # --------------------------------------------------------

      - name: Plan Backend
      # --------------------------------------------------------
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "=========================================="
          echo "Planning Backend"
          echo "=========================================="

          terraform plan \
            -target=module.backend

      # --------------------------------------------------------
      # DATABASE PLAN
      # --------------------------------------------------------

      - name: Plan Database
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "=========================================="
          echo "Planning Database"
          echo "=========================================="

          terraform plan \
            -target=module.database


  # ============================================================
  # JOB 2 - APPROVAL
  # ============================================================

  approval:
    name: "2. Approval"
    runs-on: ubuntu-latest

    needs:
      - plan-all

    environment:
      name: dev

    steps:

      - name: Deployment Approved
        run: |
          echo "=========================================="
          echo "Deployment approved"
          echo "=========================================="
          echo "Starting infrastructure creation..."


  # ============================================================
  # JOB 3 - VPC
  # ============================================================

  vpc:
    name: "3. Create VPC"
    runs-on: ubuntu-latest

    needs:
      - approval

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init

      - name: Plan VPC
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -target=module.vpc \
            -out=vpc.tfplan

      - name: Apply VPC
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply \
            -auto-approve \
            vpc.tfplan


  # ============================================================
  # JOB 4 - BASTION
  # ============================================================

  bastion:
    name: "4. Create Bastion"
    runs-on: ubuntu-latest

    needs:
      - vpc

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init

      - name: Plan Bastion
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -target=module.bastionhost \
            -out=bastion.tfplan

      - name: Apply Bastion
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply \
            -auto-approve \
            bastion.tfplan


  # ============================================================
  # JOB 5 - FRONTEND
  # ============================================================

  frontend:
    name: "5. Create Frontend"
    runs-on: ubuntu-latest

    needs:
      - bastion

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init

      - name: Plan Frontend
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -target=module.frontend \
            -out=frontend.tfplan

      - name: Apply Frontend
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply \
            -auto-approve \
            frontend.tfplan


  # ============================================================
  # JOB 6 - BACKEND
  # ============================================================

  backend:
    name: "6. Create Backend"
    runs-on: ubuntu-latest

    needs:
      - frontend

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init

      - name: Plan Backend
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -target=module.backend \
            -out=backend.tfplan

      - name: Apply Backend
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply \
            -auto-approve \
            backend.tfplan


  # ============================================================
  # JOB 7 - DATABASE
  # ============================================================

  database:
    name: "7. Create Database"
    runs-on: ubuntu-latest

    needs:
      - backend

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init

      - name: Plan Database
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -target=module.database \
            -out=database.tfplan

      - name: Apply Database
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply \
            -auto-approve \
            database.tfplan