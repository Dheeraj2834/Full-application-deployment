name: Frontend Docker CI/CD

on:
  workflow_run:
    workflows:
      - "Frontend SonarQube Quality Check"
    types:
      - completed

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: frontend
  IMAGE_TAG: latest
  CONTAINER_NAME: frontend
  CONTAINER_PORT: 8501

jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. Checkout source code
      # ==================================================
      - name: Checkout source code
        uses: actions/checkout@v4


      # ==================================================
      # 2. Configure AWS using GitHub OIDC
      # ==================================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ==================================================
      # 3. Verify AWS identity
      # ==================================================
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # ==================================================
      # 4. Create ECR repository if it doesn't exist
      # ==================================================
      - name: Create ECR repository
        run: |
          aws ecr describe-repositories \
            --repository-names "${{ env.ECR_REPOSITORY }}" \
            --region "${{ env.AWS_REGION }}" \
          || aws ecr create-repository \
            --repository-name "${{ env.ECR_REPOSITORY }}" \
            --region "${{ env.AWS_REGION }}"


      # ==================================================
      # 5. Login to Amazon ECR
      # ==================================================
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ==================================================
      # 6. Build Docker image
      # ==================================================
      - name: Build frontend Docker image
        working-directory: Application/frontend
        run: |
          docker build \
            -t ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
            .


      # ==================================================
      # 7. Verify Docker image
      # ==================================================
      - name: Verify Docker image
        run: |
          docker images


      # ==================================================
      # 8. Push Docker image to ECR
      # ==================================================
      - name: Push frontend image to ECR
        run: |
          docker push \
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}


      # ==================================================
      # 9. Deploy to private EC2 using SSM
      # ==================================================
      - name: Deploy frontend to EC2
        run: |

          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy frontend Docker container" \
            --parameters 'commands=[
              "echo Logging into Amazon ECR...",
              "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ steps.ecr.outputs.registry }}",

              "echo Pulling latest frontend image...",
              "docker pull ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}",

              "echo Stopping existing frontend container...",
              "docker stop ${{ env.CONTAINER_NAME }} || true",

              "echo Removing existing frontend container...",
              "docker rm ${{ env.CONTAINER_NAME }} || true",

              "echo Starting new frontend container...",
              "docker run -d --name ${{ env.CONTAINER_NAME }} -p 8501:8501 ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}",

              "echo Checking running containers...",
              "docker ps"
            ]' \
            --region "${{ env.AWS_REGION }}"